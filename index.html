    <style>
        /* Custom Victorian Industrial Theme */
        :root {
            --coal-dark: #141210;
            --soot-gray: #1f1c18;
            --iron-panel: #292520;
            --brass-gold: #c8963e;
            --rust-red: #9e2a2b;
            --parchment: #e6dfd3;
        }

        html, body {
            min-height: 100%;
            height: auto;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        body {
            background-color: var(--coal-dark);
            color: var(--parchment);
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(200, 150, 62, 0.08) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 8px);
        }

        .mobile-scroll-clearance {
            padding-bottom: calc(6rem + env(safe-area-inset-bottom, 24px));
        }

        .font-display {
            font-family: 'Cinzel', 'Noto Sans TC', serif;
        }

        /* Animated Steam & Gear Background Accent */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .gear-spin {
            animation: spinSlow 45s linear infinite;
        }

        /* Card & Button Styling */
        .victorian-card {
            background: linear-gradient(145deg, #26221d, #1c1915);
            border: 1px solid #443c32;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .choice-btn {
            background: linear-gradient(180deg, #322d26 0%, #24201b 100%);
            border: 1px solid #52483c;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .choice-btn:hover:not(:disabled) {
            border-color: var(--brass-gold);
            background: linear-gradient(180deg, #3d362d 0%, #2b2620 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(200, 150, 62, 0.2);
        }
        .choice-btn:active:not(:disabled) {
            transform: scale(0.99);
            border-color: var(--brass-gold);
        }
        .choice-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .brass-btn {
            background: linear-gradient(180deg, #d4a349 0%, #a67828 100%);
            color: #141210;
            font-weight: 700;
            border: 1px solid #f0c975;
            box-shadow: 0 4px 12px rgba(200, 150, 62, 0.3);
            transition: all 0.2s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .brass-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }
        .brass-btn:active {
            transform: scale(0.98);
        }

        /* Progress Bar Transitions */
        .stat-bar {
            transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s ease;
        }

        /* Subtle Shake on Harsh Damage */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake-effect {
            animation: shake 0.4s ease-in-out;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #141210; }
        ::-webkit-scrollbar-thumb { background: #443c32; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #c8963e; }
    </style>
</head>

            const langData = t();

            document.getElementById('ui-header-sub').textContent = langData.headerSub;
            document.getElementById('ui-btn-archive').textContent = langData.btnArchive;
            document.getElementById('ui-lang-label').textContent = langData.langBtn;

            document.getElementById('ui-modal-close').textContent = langData.modalClose;

            // Populate Textbook Archive Modal
            const archiveContainer = document.getElementById('archive-content');
            archiveContainer.innerHTML = langData.archiveSections.map(sec => `
                <div class="p-3.5 rounded-lg bg-stone-900/80 border border-stone-700/80">
                    <h3 class="font-bold text-amber-400 mb-1">${sec.title}</h3>
                    <p class="text-stone-300 text-xs sm:text-sm">${sec.body}</p>
                </div>
            `).join('');
        }

        function toggleArchiveModal(show) {
            const modal = document.getElementById('archive-modal');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function startGame() {
            state = {
                screen: 'play',
                endTab: 'summary',
                round: 0,
                health: 75,
                wealth: 8,
                rights: 10,
                exhaustion: 15,
                lastOutcome: null,
                historyLog: [],
                victoryType: null
            };
            render();
        }

        function setEndTab(tabName) {
            state.endTab = tabName;
            render();
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function makeChoice(choiceIndex) {
            const currentRoundData = t().rounds[state.round];
            const choice = currentRoundData.choices[choiceIndex];

            // Verify requirement if present
            if (choice.req && state[choice.req.stat] < choice.req.val) {
                return;
            }

            // Apply stat deltas
            state.health = clamp(state.health + choice.effects.health, 0, 100);
            state.wealth = Math.max(0, state.wealth + choice.effects.wealth);
            state.rights = clamp(state.rights + choice.effects.rights, 0, 100);
            state.exhaustion = clamp(state.exhaustion + choice.effects.exhaustion, 0, 100);

            state.lastOutcome = {
                choiceIndex: choiceIndex,
                effects: choice.effects
            };

            state.historyLog.push({
                round: state.round + 1,
                choiceIndex: choiceIndex
            });

            // Trigger screen shake if severe health loss or exhaustion spike
            if (choice.effects.health <= -15 || choice.effects.exhaustion >= 20) {
                const root = document.getElementById('game-root');
                root.classList.remove('shake-effect');
                void root.offsetWidth;
                root.classList.add('shake-effect');
            }

            // Check immediate fatal conditions (Health <= 0 or Exhaustion >= 100)
            if (state.health <= 0) {
                state.victoryType = 'fail_health';
                state.screen = 'end';
            } else if (state.exhaustion >= 100) {
                state.victoryType = 'fail_exhaustion';
                state.screen = 'end';
            } else {
                state.screen = 'outcome';
            }

            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function advanceRound() {
            if (state.round < 6) {
                state.round += 1;
                state.screen = 'play';
            } else {
                // Evaluate End of Round 7 Victory / Defeat Conditions (Harsh Historical Realism)
                if (state.health <= 0) {
                    state.victoryType = 'fail_health';
                } else if (state.exhaustion >= 100) {
                    state.victoryType = 'fail_exhaustion';
                } else if (state.wealth < 32) {
                    state.victoryType = 'fail_poverty';
                } else if (state.rights < 70) {
                    state.victoryType = 'fail_rights';
                } else {
                    state.victoryType = 'win_reformer';
                }
                state.screen = 'end';
            }
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

                            </div>
                            <div class="w-full h-1 sm:h-1.5 bg-stone-800 rounded-full overflow-hidden">
                                <div class="stat-bar h-full ${healthColor}" style="width: ${state.health}%"></div>
                            </div>
                        </div>

                        <!-- Exhaustion -->
                        <div class="bg-stone-900/90 px-1.5 py-1 sm:p-2 rounded-lg border border-stone-800">
                            <div class="flex justify-between items-center text-[10px] sm:text-xs mb-0.5">
                                <span class="text-stone-400 font-medium truncate">⛓️<span class="hidden xs:inline"> ${langData.statExhaustion}</span></span>
                                <span class="font-bold ${state.exhaustion >= 80 ? 'text-red-400' : 'text-stone-200'}">${state.exhaustion}</span>
                            </div>
                            <div class="w-full h-1 sm:h-1.5 bg-stone-800 rounded-full overflow-hidden">
                                <div class="stat-bar h-full ${exhaustColor}" style="width: ${state.exhaustion}%"></div>
                            </div>
                        </div>

                        <!-- Savings (Goal >= $32) -->
                        <div class="bg-stone-900/90 px-1.5 py-1 sm:p-2 rounded-lg border border-stone-800">
                            <div class="flex justify-between items-center text-[10px] sm:text-xs mb-0.5">
                                <span class="text-stone-400 font-medium truncate">💵<span class="hidden xs:inline"> ${langData.statWealth}</span></span>
                                <span class="font-bold ${state.wealth >= 32 ? 'text-amber-300' : 'text-stone-200'}">$${state.wealth}/32</span>
                            </div>
                            <div class="w-full h-1 sm:h-1.5 bg-stone-800 rounded-full overflow-hidden">
                                <div class="stat-bar h-full ${wealthColor}" style="width: ${Math.min(100, (state.wealth / 32) * 100)}%"></div>
                            </div>
                        </div>

                        <!-- Worker Rights (Goal >= 70%) -->
                        <div class="bg-stone-900/90 px-1.5 py-1 sm:p-2 rounded-lg border border-stone-800">
                            <div class="flex justify-between items-center text-[10px] sm:text-xs mb-0.5">
                                <span class="text-stone-400 font-medium truncate">✊<span class="hidden xs:inline"> ${langData.statRights}</span></span>
                                <span class="font-bold ${state.rights >= 70 ? 'text-indigo-300' : 'text-stone-200'}">${state.rights}/70%</span>
                            </div>
                            <div class="w-full h-1 sm:h-1.5 bg-stone-800 rounded-full overflow-hidden">
                                <div class="stat-bar h-full ${rightsColor}" style="width: ${Math.min(100, (state.rights / 70) * 100)}%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function formatDeltaBadge(label, val, unit = '', inverse = false, compact = false, prefixUnit = false) {
            if (val === 0) return '';
            const isPositive = inverse ? val < 0 : val > 0;
            const sign = val > 0 ? '+' : '-';
            const absVal = Math.abs(val);
            const formattedVal = prefixUnit ? `${sign}${unit}${absVal}` : `${sign}${absVal}${unit}`;
            const colorClass = isPositive
                ? 'bg-emerald-950/90 text-emerald-300 border-emerald-700/70'
                : 'bg-red-950/90 text-red-300 border-red-700/70';
            const paddingClass = compact ? 'px-1.5 py-0.5 text-[10px] sm:text-xs' : 'px-2 py-0.5 text-xs';
            return `<span class="inline-flex items-center rounded border font-semibold ${paddingClass} ${colorClass}">${label} ${formattedVal}</span>`;
        }

        function renderChoiceEffectsPreview(effects) {
            const langData = t();
            return `
                <div class="flex flex-wrap items-center gap-1 mt-1">
                    ${formatDeltaBadge('❤️', effects.health, '', false, true, false)}
                    ${formatDeltaBadge('💵', effects.wealth, langData.unitDollar, false, true, true)}
                    ${formatDeltaBadge('⛓️', effects.exhaustion, '', true, true, false)}
                    ${formatDeltaBadge('✊', effects.rights, '%', false, true, false)}
                </div>
            `;
        }

        function render() {
            const root = document.getElementById('game-root');
            const langData = t();

            // 1. INTRO SCREEN (Compact Mobile Fit with Safe Scroll)
            if (state.screen === 'intro') {
                root.innerHTML = `
                    <div class="victorian-card rounded-2xl p-4 sm:p-7 max-w-3xl w-full mx-auto flex flex-col justify-between">
                        <div>
                            <div class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-400 text-[10px] sm:text-xs font-bold tracking-wider mb-1.5">
                                ${langData.introBadge}
                            </div>
                            <h2 class="font-display text-lg sm:text-3xl font-extrabold text-stone-100 mb-1.5 sm:mb-3 leading-tight">
                                ${langData.introTitle}
                            </h2>
                            <p class="text-stone-300 text-xs sm:text-sm leading-snug sm:leading-relaxed mb-2.5 sm:mb-4">
                                ${langData.introDesc}
                            </p>
                        </div>

                        <!-- Compact SVG Industrial Skyline Illustration -->
                        <div class="w-full h-16 sm:h-28 shrink-0 rounded-xl bg-gradient-to-b from-stone-900 to-amber-950/30 border border-stone-700/80 mb-2.5 sm:mb-4 overflow-hidden relative flex items-end">
                            <svg class="w-full h-full" viewBox="0 0 800 160" preserveAspectRatio="none">
                                <circle cx="140" cy="35" r="22" fill="#3f3a34" opacity="0.5"/>
                                <circle cx="165" cy="25" r="28" fill="#4a443d" opacity="0.4"/>
                                <circle cx="480" cy="30" r="25" fill="#3f3a34" opacity="0.5"/>
                                <circle cx="510" cy="20" r="30" fill="#4a443d" opacity="0.35"/>
                                <rect x="120" y="45" width="18" height="115" fill="#1c1915"/>
                                <rect x="210" y="60" width="14" height="100" fill="#24201b"/>
                                <rect x="465" y="40" width="20" height="120" fill="#1c1915"/>
                                <rect x="640" y="55" width="16" height="105" fill="#24201b"/>
                                <polygon points="60,160 60,105 110,80 110,105 160,80 160,105 210,80 210,160" fill="#29241e"/>
                                <polygon points="380,160 380,95 440,70 440,95 500,70 500,95 560,70 560,160" fill="#211d18"/>
                                <rect x="80" y="118" width="14" height="18" fill="#d97706" opacity="0.7"/>
                                <rect x="130" y="118" width="14" height="18" fill="#d97706" opacity="0.5"/>
                                <rect x="410" y="110" width="16" height="22" fill="#ea580c" opacity="0.75"/>
                                <rect x="470" y="110" width="16" height="22" fill="#d97706" opacity="0.6"/>
                                <rect x="250" y="135" width="95" height="18" rx="3" fill="#141210"/>
                                <circle cx="270" cy="154" r="6" fill="#c8963e"/>
                                <circle cx="295" cy="154" r="6" fill="#c8963e"/>
                                <circle cx="325" cy="154" r="6" fill="#c8963e"/>
                            </svg>
                        </div>

                        <div class="bg-stone-900/90 border border-amber-700/40 rounded-xl p-3 sm:p-4 mb-2.5 sm:mb-4">
                            <h3 class="font-bold text-amber-400 text-xs sm:text-sm mb-1.5">${langData.winTitle}</h3>
                            <ul class="space-y-1 text-[11px] sm:text-xs text-stone-200 leading-snug">
                                <li>${langData.winCond1}</li>
                                <li>${langData.winCond2}</li>
                                <li>${langData.winCond3}</li>
                            </ul>
                            <p class="mt-2 pt-2 border-t border-stone-800 text-[10px] sm:text-xs text-red-300/90 italic leading-snug">
                                ${langData.warningNote}
                            </p>
                        </div>

                        <button onclick="startGame()" class="brass-btn shrink-0 w-full py-3 sm:py-3.5 px-5 rounded-xl text-sm sm:text-base tracking-wide cursor-pointer">
                            ${langData.startBtn}
                        </button>
                    </div>
                `;
                return;
            }

            // 2. PLAY SCREEN (DECISION PHASE — COMPACT & SCROLL-SAFE ON SMALL PHONES)
            if (state.screen === 'play') {
                const roundObj = langData.rounds[state.round];
                root.innerHTML = `
                    ${renderStatHUD()}
                    <div class="victorian-card rounded-2xl p-3 sm:p-5 flex flex-col justify-between gap-2.5">
                        <!-- Story & Dilemma Section -->
                        <div class="mb-1">
                            <div class="flex items-center justify-between gap-2">
                                <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-amber-500 truncate">${roundObj.era}</span>
                                <span class="text-[10px] text-stone-400 truncate max-w-[55%]">${roundObj.sourceNote.split('：')[0].split(':')[0]}</span>
                            </div>
                            <h2 class="font-display text-sm sm:text-xl font-bold text-stone-100 mt-0.5 mb-1 leading-snug">
                                ${roundObj.title}
                            </h2>
                            <p class="text-stone-300 text-xs sm:text-sm leading-relaxed mb-2">
                                ${roundObj.context}
                            </p>
                            <div class="px-2.5 py-2 rounded-lg bg-amber-950/40 border-l-2 sm:border-l-4 border-amber-500 text-stone-200 text-xs sm:text-sm font-medium leading-snug">
                                ${roundObj.dilemma}
                            </div>
                        </div>

                        <!-- 3 Choice Cards -->
                        <div class="flex flex-col gap-2 sm:gap-2.5">
                            ${roundObj.choices.map((c, idx) => {
                                const isLocked = c.req && state[c.req.stat] < c.req.val;
                                return `
                                    <button onclick="makeChoice(${idx})" ${isLocked ? 'disabled' : ''} class="choice-btn w-full text-left px-3 py-2.5 sm:p-3.5 rounded-xl flex items-center justify-between gap-2">
                                        <div class="flex-1 min-w-0">
                                            <div class="flex flex-wrap items-center gap-1 sm:gap-1.5">
                                                <span class="font-bold text-amber-300 text-xs sm:text-sm leading-tight">${idx + 1}. ${c.title}</span>
                                                ${c.req ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-semibold ${isLocked ? 'bg-red-950 text-red-300 border border-red-700' : 'bg-emerald-950 text-emerald-300 border border-emerald-700'}">${c.req.label}</span>` : ''}
                                            </div>
                                            <p class="text-[11px] sm:text-xs text-stone-400 leading-snug mt-0.5">${c.desc}</p>
                                            ${renderChoiceEffectsPreview(c.effects)}
                                        </div>
                                        <div class="shrink-0">
                                            <span class="inline-flex items-center justify-center w-6 h-6 sm:w-8 sm:h-8 rounded-full bg-stone-800 border border-stone-600 text-amber-400 text-xs sm:text-sm font-bold">
                                                →
                                            </span>
                                        </div>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                return;
            }

            // 3. OUTCOME SCREEN (CONSEQUENCE PHASE — SCROLL-SAFE)
            if (state.screen === 'outcome') {
                const roundObj = langData.rounds[state.round];
                const chosen = roundObj.choices[state.lastOutcome.choiceIndex];
                const eff = state.lastOutcome.effects;

                root.innerHTML = `
                    ${renderStatHUD()}
                    <div class="victorian-card rounded-2xl p-4 sm:p-6 max-w-3xl w-full mx-auto flex flex-col justify-between gap-3">
                        <div>
                            <div class="text-[10px] sm:text-xs font-bold uppercase tracking-widest text-amber-500 mb-1">
                                ${langData.consequenceLabel}
                            </div>
                            <h2 class="font-display text-lg sm:text-2xl font-bold text-stone-100 mb-2 sm:mb-3 leading-snug">
                                ${chosen.outcomeTitle}
                            </h2>
                            <p class="text-stone-300 text-xs sm:text-base leading-relaxed mb-3 sm:mb-4">
                                ${chosen.outcomeText}
                            </p>

                            <div class="flex flex-wrap gap-1.5 sm:gap-2 p-2.5 sm:p-3.5 rounded-xl bg-stone-900/90 border border-stone-700 mb-3">
                                ${formatDeltaBadge('❤️ ' + langData.statHealth, eff.health, '', false, false, false)}
                                ${formatDeltaBadge('⛓️ ' + langData.statExhaustion, eff.exhaustion, '', true, false, false)}
                                ${formatDeltaBadge('💵 ' + langData.statWealth, eff.wealth, langData.unitDollar, false, false, true)}
                                ${formatDeltaBadge('✊ ' + langData.statRights, eff.rights, '%', false, false, false)}
                            </div>

                            <div class="p-2.5 rounded-lg bg-stone-950/70 border border-stone-800 text-[11px] sm:text-xs text-stone-400 leading-snug">
                                <span class="text-amber-400 font-bold mr-1">[${langData.primarySourceLabel}]</span>${roundObj.sourceNote}
                            </div>
                        </div>

                        <button onclick="advanceRound()" class="brass-btn shrink-0 w-full py-3 sm:py-3.5 px-5 rounded-xl text-sm sm:text-base cursor-pointer mt-3">
                            ${state.round < 6 ? langData.nextRoundBtn : langData.finalResultBtn}
                        </button>
                    </div>
                `;
                return;
            }

            // 4. END SCREEN (TABBED VIEW: FATE SUMMARY vs TEXTBOOK REFLECTION — SCROLL-SAFE)
            if (state.screen === 'end') {
                const ending = langData.endings[state.victoryType];
                const isWin = state.victoryType === 'win_reformer';

                root.innerHTML = `
                    <div class="victorian-card rounded-2xl p-3.5 sm:p-6 max-w-3xl w-full mx-auto flex flex-col justify-between border-2 ${isWin ? 'border-amber-500/70' : 'border-red-800/70'}">
                        <!-- Top Tab Switcher -->
                        <div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-stone-950 border border-stone-800 mb-3">
                            <button onclick="setEndTab('summary')" class="py-1.5 px-2 rounded-lg text-xs sm:text-sm font-bold transition ${state.endTab === 'summary' ? 'bg-amber-600 text-stone-950' : 'text-stone-400 hover:text-stone-200'}">
                                ${langData.tabFateLabel}
                            </button>
                            <button onclick="setEndTab('reflection')" class="py-1.5 px-2 rounded-lg text-xs sm:text-sm font-bold transition ${state.endTab === 'reflection' ? 'bg-amber-600 text-stone-950' : 'text-stone-400 hover:text-stone-200'}">
                                ${langData.tabReflectLabel}
                            </button>
                        </div>

                        <!-- Tab 1: Final Fate & Stats -->
                        ${state.endTab === 'summary' ? `
                            <div class="flex flex-col justify-center">
                                <div class="inline-block self-start px-2.5 py-0.5 rounded-full text-[10px] sm:text-xs font-bold tracking-wider mb-2 ${isWin ? 'bg-emerald-950 text-emerald-300 border border-emerald-600' : 'bg-red-950 text-red-300 border border-red-700'}">
                                    ${ending.badge}
                                </div>
                                <h2 class="font-display text-lg sm:text-2xl font-extrabold text-stone-100 mb-2 leading-tight">
                                    ${ending.title}
                                </h2>
                                <p class="text-stone-300 text-xs sm:text-sm leading-relaxed mb-3 sm:mb-4">
                                    ${ending.desc}
                                </p>

                                <!-- Final Score Summary -->
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-3">
                                    <div class="p-2 sm:p-2.5 rounded-xl bg-stone-900 border border-stone-700 text-center">
                                        <div class="text-[10px] sm:text-xs text-stone-400">❤️ ${langData.statHealth}</div>
                                        <div class="text-sm sm:text-base font-bold ${state.health > 0 ? 'text-emerald-400' : 'text-red-400'}">${state.health}/100</div>
                                    </div>
                                    <div class="p-2 sm:p-2.5 rounded-xl bg-stone-900 border border-stone-700 text-center">
                                        <div class="text-[10px] sm:text-xs text-stone-400">⛓️ ${langData.statExhaustion}</div>
                                        <div class="text-sm sm:text-base font-bold ${state.exhaustion < 100 ? 'text-sky-400' : 'text-red-400'}">${state.exhaustion}/100</div>
                                    </div>
                                    <div class="p-2 sm:p-2.5 rounded-xl bg-stone-900 border border-stone-700 text-center">
                                        <div class="text-[10px] sm:text-xs text-stone-400">💵 ${langData.statWealth}</div>
                                        <div class="text-sm sm:text-base font-bold ${state.wealth >= 32 ? 'text-amber-300' : 'text-red-400'}">$${state.wealth} / $32</div>
                                    </div>
                                    <div class="p-2 sm:p-2.5 rounded-xl bg-stone-900 border border-stone-700 text-center">
                                        <div class="text-[10px] sm:text-xs text-stone-400">✊ ${langData.statRights}</div>
                                        <div class="text-sm sm:text-base font-bold ${state.rights >= 70 ? 'text-indigo-300' : 'text-red-400'}">${state.rights} / 70%</div>
                                    </div>
                                </div>
                            </div>
                        ` : `
                            <!-- Tab 2: Textbook Reflection & Synthesis -->
                            <div class="space-y-2.5">
                                <div class="inline-block px-2.5 py-0.5 rounded-full bg-amber-500/15 border border-amber-500/40 text-amber-400 text-[10px] sm:text-xs font-bold tracking-wider">
                                    ${langData.reflectionBadge}
                                </div>
                                <h2 class="font-display text-base sm:text-xl font-bold text-stone-100 leading-snug">
                                    ${langData.reflectionTitle}
                                </h2>
                                <div class="space-y-2">
                                    ${langData.reflectionPoints.map(pt => `
                                        <div class="p-2.5 rounded-xl bg-stone-900/90 border border-stone-700/80">
                                            <h3 class="font-bold text-amber-400 text-xs sm:text-sm mb-0.5">${pt.concept}</h3>
                                            <p class="text-stone-300 text-[11px] sm:text-xs leading-relaxed">${pt.detail}</p>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="p-2.5 sm:p-3 rounded-xl bg-amber-950/40 border border-amber-600/50">
                                    <div class="font-bold text-amber-300 text-xs mb-0.5">${langData.reflectionQuestionTitle}</div>
                                    <p class="text-stone-200 text-[11px] sm:text-xs italic leading-relaxed">${langData.reflectionQuestion}</p>
                                </div>
                            </div>
                        `}

                        <button onclick="startGame()" class="brass-btn shrink-0 w-full py-3 sm:py-3.5 px-5 rounded-xl text-sm sm:text-base cursor-pointer mt-3">
                            ${langData.playAgainBtn}
                        </button>
                    </div>
                `;
                return;
            }
        }

        // Initialize UI on window load
        window.onload = function () {
            updateStaticUI();
            render();
        };
    </script>
</body>
</html>
